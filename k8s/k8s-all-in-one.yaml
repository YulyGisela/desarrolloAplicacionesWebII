apiVersion: v1
kind: Namespace
metadata:
  name: bodegapro
  labels:
    app.kubernetes.io/name: bodegapro
    app.kubernetes.io/part-of: bodegapro-platform
---
apiVersion: v1
kind: Secret
metadata:
  name: bodegapro-secrets
  namespace: bodegapro
  labels:
    app.kubernetes.io/name: bodegapro
    app.kubernetes.io/part-of: bodegapro-platform
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "password"
  MYSQL_PASSWORD: "password"
  SPRING_DATASOURCE_PASSWORD: "password"
  RABBITMQ_DEFAULT_PASS: "guest"
  SPRING_RABBITMQ_PASSWORD: "guest"
  JWT_SECRET: "bodegapro-jwt-secret-key-2026-cibertec-minimo-32-caracteres"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bodegapro-config
  namespace: bodegapro
  labels:
    app.kubernetes.io/name: bodegapro
    app.kubernetes.io/part-of: bodegapro-platform
data:
  MYSQL_DATABASE: "appdb"
  MYSQL_USER: "app"
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/appdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima"
  SPRING_DATASOURCE_USERNAME: "app"
  RABBITMQ_DEFAULT_USER: "guest"
  SPRING_RABBITMQ_HOST: "rabbitmq"
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_USERNAME: "guest"
  SPRING_PROFILES_ACTIVE: "native"
  SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
  AUTH_SERVICE_URL: "http://auth-service:8081"
  CATALOG_SERVICE_URL: "http://catalog-service:8082"
  INVENTORY_SERVICE_URL: "http://inventory-service:8083"
  API_GATEWAY_URL: "http://api-gateway:8080"
---
apiVersion: v1
