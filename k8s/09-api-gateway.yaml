apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: bodegapro
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: bodegapro-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: bodegapro-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: bodegapro-config
                  key: AUTH_SERVICE_URL
            - name: CATALOG_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: bodegapro-config
                  key: CATALOG_SERVICE_URL
            - name: INVENTORY_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: bodegapro-config
                  key: INVENTORY_SERVICE_URL
            - name: API_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: bodegapro-config
                  key: API_GATEWAY_URL
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bodegapro-secrets
                  key: JWT_SECRET
            - name: SPRING_CONFIG_IMPORT
              valueFrom:
                configMapKeyRef:
                  name: bodegapro-config
                  key: SPRING_CONFIG_IMPORT
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: bodegapro
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: bodegapro-platform
spec:
  # Type LoadBalancer works in Docker Desktop / Cloud, and falls back to NodePort
  type: LoadBalancer
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      name: http
  selector:
    app: api-gateway
