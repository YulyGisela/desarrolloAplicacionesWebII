version: '3.8'

networks:
  bodegapro-network:
    driver: bridge

volumes:
  mysql-data:
  rabbitmq-data:
  elasticsearch-data:
  grafana-data:

services:
  # -------------------------------------------------------------
  # CAPA DE DATOS Y MENSAJERÍA
  # -------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: bodegapro-mysql
    restart: unless-stopped
    ports:
      - "5510:3306"
    environment:
      MYSQL_DATABASE: appdb
      MYSQL_USER: app
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/bodegapro.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bodegapro-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bodegapro-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - bodegapro-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # CAPA DE OBSERVABILIDAD (PROMETHEUS, GRAFANA, ELK)
  # -------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.18
    container_name: bodegapro-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - bodegapro-network

  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.18
    container_name: bodegapro-logstash
    restart: unless-stopped
    ports:
      - "5044:5044"
    volumes:
      - ./docker/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    depends_on:
      - elasticsearch
    networks:
      - bodegapro-network

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.18
    container_name: bodegapro-kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - bodegapro-network

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: bodegapro-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - bodegapro-network

  grafana:
    image: grafana/grafana:10.0.3
    container_name: bodegapro-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - bodegapro-network

  # -------------------------------------------------------------
  # CAPA DE MICROSERVICIOS SPRING BOOT
  # En desarrollo híbrido, iniciar solo la infraestructura con Docker y
  # ejecutar estos servicios desde el IDE. No publicar sus puertos al host.
  # -------------------------------------------------------------
  config-server:
    build:
      context: ./backend/config-server
    container_name: bodegapro-config-server
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=native
      - LOGGING_LOGSTASH_HOST=logstash
      - LOGGING_LOGSTASH_PORT=5044
    networks:
      - bodegapro-network

  auth-service:
    build:
      context: ./backend/auth-service
    container_name: bodegapro-auth-service
    restart: unless-stopped
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/appdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
      - SPRING_DATASOURCE_USERNAME=app
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - LOGGING_LOGSTASH_HOST=logstash
      - LOGGING_LOGSTASH_PORT=5044
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_started
    networks:
      - bodegapro-network

  catalog-service:
    build:
      context: ./backend/catalog-service
    container_name: bodegapro-catalog-service
    restart: unless-stopped
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/appdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
      - SPRING_DATASOURCE_USERNAME=app
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - LOGGING_LOGSTASH_HOST=logstash
      - LOGGING_LOGSTASH_PORT=5044
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      config-server:
        condition: service_started
    networks:
      - bodegapro-network

  inventory-service:
    build:
      context: ./backend/inventory-service
    container_name: bodegapro-inventory-service
    restart: unless-stopped
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/appdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
      - SPRING_DATASOURCE_USERNAME=app
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      - CATALOG_SERVICE_URL=http://catalog-service:8082
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - LOGGING_LOGSTASH_HOST=logstash
      - LOGGING_LOGSTASH_PORT=5044
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      config-server:
        condition: service_started
    networks:
      - bodegapro-network

  notification-service:
    build:
      context: ./backend/notification-service
    container_name: bodegapro-notification-service
    restart: unless-stopped
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      - RABBIT_HEALTH_ENABLED=true
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - LOGGING_LOGSTASH_HOST=logstash
      - LOGGING_LOGSTASH_PORT=5044
    depends_on:
      rabbitmq:
        condition: service_healthy
      config-server:
        condition: service_started
    networks:
      - bodegapro-network

  api-gateway:
    build:
      context: ./backend/api-gateway
    container_name: bodegapro-api-gateway
    restart: unless-stopped
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081
      - CATALOG_SERVICE_URL=http://catalog-service:8082
      - INVENTORY_SERVICE_URL=http://inventory-service:8083
      - NOTIFICATION_SERVICE_URL=http://notification-service:8084
      - API_GATEWAY_URL=http://api-gateway:8080
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - LOGGING_LOGSTASH_HOST=logstash
      - LOGGING_LOGSTASH_PORT=5044
    depends_on:
      - auth-service
      - catalog-service
      - inventory-service
      - notification-service
      - config-server
    networks:
      - bodegapro-network
