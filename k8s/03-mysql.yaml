apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: bodegapro
  labels:
    app: mysql
    app.kubernetes.io/part-of: bodegapro-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-config
  namespace: bodegapro
  labels:
    app: mysql
    app.kubernetes.io/part-of: bodegapro-platform
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS appdb CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    USE appdb;

    CREATE TABLE IF NOT EXISTS usuarios (
        id        BIGINT AUTO_INCREMENT PRIMARY KEY,
        nombre    VARCHAR(120) NOT NULL,
        username  VARCHAR(50)  NOT NULL UNIQUE,
        email     VARCHAR(120) NOT NULL UNIQUE,
        password  VARCHAR(255) NOT NULL COMMENT 'Hash BCrypt, nunca texto plano',
        role      VARCHAR(30)  NOT NULL COMMENT 'ADMIN | VENDEDOR'
    );

    CREATE TABLE IF NOT EXISTS categorias (
        id          BIGINT AUTO_INCREMENT PRIMARY KEY,
        nombre      VARCHAR(80)  NOT NULL UNIQUE,
        descripcion VARCHAR(255)
    );

    CREATE TABLE IF NOT EXISTS proveedores (
        id           BIGINT AUTO_INCREMENT PRIMARY KEY,
        razon_social VARCHAR(120) NOT NULL,
        ruc          VARCHAR(11)  NOT NULL UNIQUE,
        telefono     VARCHAR(20),
        email        VARCHAR(120)
    );

    CREATE TABLE IF NOT EXISTS productos (
        id                BIGINT AUTO_INCREMENT PRIMARY KEY,
        codigo            VARCHAR(30)  NOT NULL UNIQUE,
        nombre            VARCHAR(120) NOT NULL,
        descripcion       VARCHAR(255),
        precio_compra     DECIMAL(10,2) NOT NULL,
        precio_venta      DECIMAL(10,2) NOT NULL,
        stock_actual      INT NOT NULL,
        stock_minimo      INT NOT NULL,
        fecha_vencimiento DATE,
        categoria_id      BIGINT NOT NULL,
        proveedor_id      BIGINT,
        CONSTRAINT fk_producto_categoria FOREIGN KEY (categoria_id) REFERENCES categorias (id),
        CONSTRAINT fk_producto_proveedor FOREIGN KEY (proveedor_id) REFERENCES proveedores (id)
    );

    CREATE TABLE IF NOT EXISTS movimientos_stock (
        id          BIGINT AUTO_INCREMENT PRIMARY KEY,
        producto_id BIGINT      NOT NULL,
        tipo        VARCHAR(10) NOT NULL COMMENT 'ENTRADA | SALIDA',
        cantidad    INT         NOT NULL,
        motivo      VARCHAR(200),
        fecha       DATETIME(6) NOT NULL,
        usuario     VARCHAR(50) NOT NULL,
        CONSTRAINT fk_movimiento_producto FOREIGN KEY (producto_id) REFERENCES productos (id)
    );

    -- Datos iniciales de prueba
    INSERT IGNORE INTO categorias (id, nombre, descripcion) VALUES
    (1, 'Abarrotes', 'Arroz, azúcar, menestras y similares'),
    (2, 'Bebidas', 'Gaseosas, aguas y jugos'),
    (3, 'Lácteos', 'Leche, yogurt y derivados'),
    (4, 'Limpieza', 'Detergentes y articulos de aseo'),
    (5, 'Snacks', 'Galletas, piqueos y golosinas');

    INSERT IGNORE INTO proveedores (id, razon_social, ruc, telefono, email) VALUES
    (1, 'Distribuidora Andina S.A.C.', '20512345678', '014567890', 'ventas@andina.pe'),
    (2, 'Alimentos del Sur E.I.R.L.', '20498765432', '054223344', 'contacto@alimentossur.pe'),
    (3, 'Bebidas Lima S.A.', '20601234567', '017778899', 'pedidos@bebidaslima.pe');

    INSERT IGNORE INTO productos (id, codigo, nombre, descripcion, precio_compra, precio_venta, stock_actual, stock_minimo, fecha_vencimiento, categoria_id, proveedor_id) VALUES
    (1, 'ABR-001', 'Arroz extra 5 kg', 'Arroz superior 5 kg', 18.50, 22.00, 40, 10, NULL, 1, 1),
    (2, 'ABR-002', 'Azúcar rubia 1 kg', 'Azúcar rubia doméstica', 3.40, 4.50, 8, 15, NULL, 1, 1),
    (3, 'BEB-001', 'Gaseosa 1.5 L', 'Gaseosa sabor cola 1.5L', 4.20, 6.00, 60, 20, DATE_ADD(CURDATE(), INTERVAL 180 DAY), 2, 3),
    (4, 'BEB-002', 'Agua mineral 625 ml', 'Agua mineral sin gas', 0.90, 1.50, 120, 40, DATE_ADD(CURDATE(), INTERVAL 365 DAY), 2, 3),
    (5, 'LAC-001', 'Leche evaporada 400 g', 'Leche entera evaporada', 3.10, 4.20, 5, 12, DATE_ADD(CURDATE(), INTERVAL 20 DAY), 3, 2),
    (6, 'LAC-002', 'Yogurt de fresa 1 L', 'Yogurt batido de fresa', 5.50, 7.50, 18, 6, DATE_ADD(CURDATE(), INTERVAL 9 DAY), 3, 2),
    (7, 'LIM-001', 'Detergente en polvo 800 g', 'Detergente multiusos', 9.80, 13.00, 25, 8, NULL, 4, 1),
    (8, 'SNK-001', 'Galletas de soda x6', 'Galletas de soda paquete familiar', 0.70, 1.20, 90, 30, DATE_ADD(CURDATE(), INTERVAL 120 DAY), 5, 2);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: bodegapro
  labels:
    app: mysql
    app.kubernetes.io/part-of: bodegapro-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: bodegapro-config
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: bodegapro-config
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bodegapro-secrets
                  key: MYSQL_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bodegapro-secrets
                  key: MYSQL_ROOT_PASSWORD
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-uapp", "-ppassword"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-uapp", "-ppassword"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc
        - name: mysql-init
          configMap:
            name: mysql-init-config
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: bodegapro
  labels:
    app: mysql
    app.kubernetes.io/part-of: bodegapro-platform
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
  selector:
    app: mysql
